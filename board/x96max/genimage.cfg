image boot.vfat {
	vfat {
		label = "X96BOOT"
		extraargs = "-F 32"
		files = { "Image", "meson-g12a-x96-max-p.dtb" }
	}
	size = 128M
}

image sdcard.img {
	hdimage {
		partition-table-type = "mbr"
		disk-signature = 0x96320001
	}
	partition boot {
		partition-type = 0x0c
		bootable = "true"
		offset = 1M
		image = "boot.vfat"
	}
	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
	}
}
