image ramboot.vfat {
	vfat {
		label = "X96RAMBOOT"
		extraargs = "-F 32"
		files = { "Image", "meson-g12a-x96-max-p.dtb", "meson-g12a-x96-max-p-ephy-4g.dtb", "rootfs.cpio.uboot" }
	}
	size = 128M
}

image ramboot.img {
	hdimage {
		partition-table-type = "mbr"
		disk-signature = 0x96320002
	}
	partition boot {
		partition-type = 0x0c
		bootable = "true"
		offset = 1M
		image = "ramboot.vfat"
	}
}
